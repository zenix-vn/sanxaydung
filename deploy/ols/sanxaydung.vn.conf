# OpenLiteSpeed vhost cho sanxaydung.vn (+ www -> chuyển về apex), công khai, không Basic Auth
#   *.sanxaydung.vn -> website doanh nghiệp (middleware Next.js đọc Host và chuyển sang /site/<tên>)
#   /            -> web Next.js (container sxd-web) 127.0.0.1:3020
#   /auth/v1/ /rest/v1/ /storage/v1/ /realtime/v1/ -> Kong (stack sxd-supabase) 127.0.0.1:8110  [không Basic Auth]
docRoot                   /usr/local/lsws/sanxaydung.vn/html
vhDomain                  sanxaydung.vn
vhAliases                 www.sanxaydung.vn, *.sanxaydung.vn
enableGzip                1

errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}
accesslog $VH_ROOT/logs/access.log {
  useServer               0
  rollingSize             10M
  keepDays                30
}

index  {
  useServer               0
  autoIndex               0
  indexFiles              index.html
}

extprocessor sxdweb {
  type                    proxy
  address                 127.0.0.1:3020
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

extprocessor sxdkong {
  type                    proxy
  address                 127.0.0.1:8110
  maxConns                200
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

rewrite  {
  enable                  1
  rules                   <<<END_rules
# www -> apex
RewriteCond %{HTTP_HOST} ^www\.sanxaydung\.vn$ [NC]
RewriteRule ^/?(.*)$ https://sanxaydung.vn/$1 [R=301,L]
# http -> https, GIỮ NGUYÊN tên miền (website doanh nghiệp ở tên miền con)
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteCond %{HTTPS} !on
RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
  END_rules
}

context /.well-known/acme-challenge/ {
  location                /usr/local/lsws/sanxaydung.vn/html/.well-known/acme-challenge/
  allowBrowse             1
}

context /auth/v1/ {
  type                    proxy
  handler                 sxdkong
  addDefaultCharset       off
}
context /rest/v1/ {
  type                    proxy
  handler                 sxdkong
  addDefaultCharset       off
}
context /storage/v1/ {
  type                    proxy
  handler                 sxdkong
  addDefaultCharset       off
}
context /realtime/v1/ {
  type                    proxy
  handler                 sxdkong
  addDefaultCharset       off
}
websocket /realtime/v1/ {
  address                 127.0.0.1:8110
}

context / {
  type                    proxy
  handler                 sxdweb
  addDefaultCharset       off
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/sanxaydung.vn/privkey.pem
  certFile                /etc/letsencrypt/live/sanxaydung.vn/fullchain.pem
  certChain               1
  sslProtocol             24
}
