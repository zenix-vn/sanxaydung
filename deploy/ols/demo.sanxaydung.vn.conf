# demo.sanxaydung.vn: chỉ chuyển hướng 301 sang domain chính sanxaydung.vn (giữ link cũ)
docRoot                   /usr/local/lsws/demo.sanxaydung.vn/html
vhDomain                  demo.sanxaydung.vn
enableGzip                1

errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

index  {
  useServer               0
  autoIndex               0
  indexFiles              index.html
}

rewrite  {
  enable                  1
  rules                   <<<END_rules
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?(.*)$ https://sanxaydung.vn/$1 [R=301,L]
  END_rules
}

context /.well-known/acme-challenge/ {
  location                /usr/local/lsws/demo.sanxaydung.vn/html/.well-known/acme-challenge/
  allowBrowse             1
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/demo.sanxaydung.vn/privkey.pem
  certFile                /etc/letsencrypt/live/demo.sanxaydung.vn/fullchain.pem
  certChain               1
  sslProtocol             24
}
