# OpenLiteSpeed vhost cho demo.sanxaydung.vn
#   /            -> web Next.js (container sxd-web) 127.0.0.1:3020   [Basic Auth: giữ hành vi demo cũ]
#   /auth/v1/ /rest/v1/ /storage/v1/ /realtime/v1/ -> Kong (stack sxd-supabase) 127.0.0.1:8110  [không Basic Auth]
docRoot                   /usr/local/lsws/demo.sanxaydung.vn/html
vhDomain                  demo.sanxaydung.vn
enableGzip                1

errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}
accesslog $VH_ROOT/logs/access.log {
  useServer               0
  rollingSize             10M
  keepDays                30
}

index  {
  useServer               0
  autoIndex               0
  indexFiles              index.html
}

extprocessor sxdweb {
  type                    proxy
  address                 127.0.0.1:3020
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

extprocessor sxdkong {
  type                    proxy
  address                 127.0.0.1:8110
  maxConns                200
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

rewrite  {
  enable                  1
  rules                   <<<END_rules
RewriteCond %{HTTPS} !on
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
  END_rules
}

context /.well-known/acme-challenge/ {
  location                /usr/local/lsws/demo.sanxaydung.vn/html/.well-known/acme-challenge/
  allowBrowse             1
}

context /auth/v1/ {
  type                    proxy
  handler                 sxdkong
  addDefaultCharset       off
}
context /rest/v1/ {
  type                    proxy
  handler                 sxdkong
  addDefaultCharset       off
}
context /storage/v1/ {
  type                    proxy
  handler                 sxdkong
  addDefaultCharset       off
}
context /realtime/v1/ {
  type                    proxy
  handler                 sxdkong
  addDefaultCharset       off
}
websocket /realtime/v1/ {
  address                 127.0.0.1:8110
}

realm sxdbasic {
  userDB  {
    location              /usr/local/lsws/conf/vhosts/demo.sanxaydung.vn/htpasswd
    maxCacheSize          200
    cacheTimeout          60
  }
}

# Basic Auth chỉ áp cho web. Context "/" sẽ truyền realm xuống các context con (/rest/v1/...),
# nên dùng regex loại trừ đường dẫn API thay vì "context /".
context exp:^/(?!auth/v1/|rest/v1/|storage/v1/|realtime/v1/|\.well-known/) {
  type                    proxy
  handler                 sxdweb
  addDefaultCharset       off
  realm                   sxdbasic
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/demo.sanxaydung.vn/privkey.pem
  certFile                /etc/letsencrypt/live/demo.sanxaydung.vn/fullchain.pem
  certChain               1
  sslProtocol             24
}
